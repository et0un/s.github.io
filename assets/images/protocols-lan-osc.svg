<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" width="1000" height="530" role="img"><title>Два компьютера в одной локальной сети передают OSC в обе стороны</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b2d7bd"/></marker></defs><rect x="8" y="8" width="984" height="514" rx="20" fill="#111" stroke="#66766b" stroke-dasharray="8 6"/><g fill="#eee" font-family="Arial,sans-serif" text-anchor="middle"><text x="500" y="52" font-size="27" font-weight="bold">Одна локальная сеть</text><text x="500" y="85" font-size="19" fill="#bbb">Ethernet или Wi-Fi · пример адресации 192.168.1.0/24</text><rect x="32" y="125" width="280" height="330" rx="16" fill="#252525" stroke="#777"/><rect x="688" y="125" width="280" height="330" rx="16" fill="#252525" stroke="#777"/><text x="172" y="166" font-size="25" font-weight="bold">Компьютер A</text><text x="828" y="166" font-size="25" font-weight="bold">Компьютер B</text><g font-size="22"><text x="172" y="202">192.168.1.20</text><text x="828" y="202">192.168.1.42</text><text x="172" y="252">Unreal</text><text x="828" y="252">TouchDesigner</text></g><g font-size="18" fill="#ccc"><text x="172" y="298">Отправляет level = 0.4</text><text x="828" y="298">Принимает на UDP 9000</text><text x="172" y="391">Принимает на UDP 9001</text><text x="828" y="391">Отправляет status = ready</text></g><g font-size="20" fill="#b2d7bd"><text x="500" y="208">OSC · /light/level 0.4</text><text x="500" y="237">К 192.168.1.42:9000</text><path d="M320 268H680" stroke="#b2d7bd" stroke-width="3" marker-end="url(#a)"/><text x="500" y="322">OSC · /status ready</text><text x="500" y="351">К 192.168.1.20:9001</text><path d="M680 382H320" stroke="#b2d7bd" stroke-width="3" marker-end="url(#a)"/></g><text x="500" y="493" font-size="19" fill="#ccc">Для обратного сообщения отдельно настраивают отправитель и приёмник</text></g></svg>