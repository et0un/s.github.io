<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Как работает трассировка лучей</title><desc id="desc">Расчёт идёт от камеры через пиксель к поверхности. От точки попадания отражённый луч достигает источника света. Физический свет распространяется в обратном направлении.</desc>
<defs><marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8ac8ff"/></marker><marker id="mint" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#80e6c4"/></marker><radialGradient id="metal" cx=".25" cy=".2"><stop stop-color="#d8e0eb"/><stop offset=".45" stop-color="#5d6c80"/><stop offset="1" stop-color="#1c2330"/></radialGradient></defs>
<rect width="1200" height="620" rx="18" fill="#11151d"/>
<g font-family="Arial,sans-serif" fill="#ecf0f5"><text x="36" y="48" font-size="29" font-weight="bold">Луч связывает пиксель с поверхностью и светом</text>
<rect x="470" y="90" width="100" height="22" rx="7" fill="#ffe5a3"/><text x="596" y="111" font-size="24" fill="#ffe5a3">Источник света</text>
<circle cx="612" cy="392" r="130" fill="url(#metal)" stroke="#a4afbf" stroke-width="2"/>
<rect x="72" y="273" width="80" height="55" rx="10" fill="#253d58" stroke="#8ac8ff" stroke-width="2"/><path d="M152 285L178 272V330L152 317Z" fill="#253d58" stroke="#8ac8ff" stroke-width="2"/>
<path d="M282 170V430" stroke="#78849a" stroke-width="2"/><rect x="274" y="292" width="16" height="16" fill="#8ac8ff"/>
<path d="M179 300H508" fill="none" stroke="#8ac8ff" stroke-width="4" marker-end="url(#blue)"/>
<path d="M520 293V119" fill="none" stroke="#80e6c4" stroke-width="4" marker-end="url(#mint)"/>
<circle cx="520" cy="300" r="7" fill="#fff"/>
<path d="M520 300L463 243" stroke="#b8c2d2" stroke-width="2" stroke-dasharray="5 7"/>
<text x="70" y="367" font-size="24">Камера</text><text x="230" y="464" font-size="23">Пиксель</text>
<text x="315" y="279" font-size="23" fill="#8ac8ff">1. Найти поверхность</text>
<text x="548" y="203" font-size="23" fill="#80e6c4">2. Продолжить луч</text><text x="548" y="234" font-size="22" fill="#b3c0d0">по свойствам материала</text>
<text x="799" y="330" font-size="24">Гладкая поверхность</text><text x="799" y="364" font-size="22" fill="#b3c0d0">задаёт направление</text><text x="799" y="394" font-size="22" fill="#b3c0d0">зеркального отражения</text>
<text x="36" y="580" font-size="23" fill="#b3c0d0">Стрелки показывают ход расчёта. Физический свет идёт от источника к камере.</text></g></svg>