<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc"><title id="title">Растеризация, гибридный рендер и path tracing</title><desc id="desc">При растеризации видимость задаётся проекцией треугольников. Гибридный рендер добавляет лучи для выбранных эффектов. Path tracing оценивает перенос света по множеству путей.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="#a8b7cb"/></marker></defs><rect width="1200" height="590" rx="18" fill="#11151d"/><g font-family="Arial,sans-serif" fill="#ecf0f5"><text x="36" y="47" font-size="29" font-weight="bold">Один материал — разные способы получить изображение</text><rect x="28" y="80" width="354" height="475" rx="12" fill="#1c2330" stroke="#394457"/><text x="46" y="123" font-size="27" font-weight="bold" fill="#8ac8ff">Растеризация</text><rect x="42" y="151" width="326" height="58" rx="7" fill="#101720"/><text x="54" y="187" font-size="20">Треугольники → пиксели</text><path d="M204 211v18" stroke="#a8b7cb" stroke-width="2" marker-end="url(#a)"/><rect x="42" y="232" width="326" height="58" rx="7" fill="#101720"/><text x="54" y="268" font-size="20">Шейдер поверхности</text><path d="M204 292v18" stroke="#a8b7cb" stroke-width="2" marker-end="url(#a)"/><rect x="42" y="313" width="326" height="58" rx="7" fill="#101720"/><text x="54" y="349" font-size="20">Карты теней, пробы, SSR</text><text x="46" y="443" font-size="21" fill="#bbc6d6">Быстрая основа для сцены.</text><text x="46" y="474" font-size="21" fill="#bbc6d6">Отражения и непрямой свет</text><text x="46" y="505" font-size="21" fill="#bbc6d6">требуют отдельных методов.</text><rect x="423" y="80" width="354" height="475" rx="12" fill="#1c2330" stroke="#394457"/><text x="441" y="123" font-size="27" font-weight="bold" fill="#ccb0ff">Гибридный рендер</text><rect x="437" y="151" width="326" height="58" rx="7" fill="#101720"/><text x="449" y="187" font-size="20">Растеризация видимости</text><path d="M599 211v18" stroke="#a8b7cb" stroke-width="2" marker-end="url(#a)"/><rect x="437" y="232" width="326" height="58" rx="7" fill="#101720"/><text x="449" y="268" font-size="20">Лучи для части эффектов</text><path d="M599 292v18" stroke="#a8b7cb" stroke-width="2" marker-end="url(#a)"/><rect x="437" y="313" width="326" height="58" rx="7" fill="#101720"/><text x="449" y="349" font-size="20">Объединение результата</text><text x="441" y="443" font-size="21" fill="#bbc6d6">Например, лучевые отражения</text><text x="441" y="474" font-size="21" fill="#bbc6d6">при обычной отрисовке</text><text x="441" y="505" font-size="21" fill="#bbc6d6">остальной сцены.</text><rect x="818" y="80" width="354" height="475" rx="12" fill="#1c2330" stroke="#394457"/><text x="836" y="123" font-size="27" font-weight="bold" fill="#80e6c4">Path tracing</text><rect x="832" y="151" width="326" height="58" rx="7" fill="#101720"/><text x="844" y="187" font-size="20">Лучи из камеры</text><path d="M994 211v18" stroke="#a8b7cb" stroke-width="2" marker-end="url(#a)"/><rect x="832" y="232" width="326" height="58" rx="7" fill="#101720"/><text x="844" y="268" font-size="20">Отражения и преломления</text><path d="M994 292v18" stroke="#a8b7cb" stroke-width="2" marker-end="url(#a)"/><rect x="832" y="313" width="326" height="58" rx="7" fill="#101720"/><text x="844" y="349" font-size="20">Накопление и шумоподавление</text><text x="836" y="443" font-size="21" fill="#bbc6d6">Оценка переноса света</text><text x="836" y="474" font-size="21" fill="#bbc6d6">по множеству путей.</text><text x="836" y="505" font-size="21" fill="#bbc6d6">Качество связано с бюджетом.</text></g></svg>