<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Атака как последовательность состояний</title><desc id="desc">Команда игрока: Нажатие атаки: при готовом персонаже. Состояние атаки: Подготовка и окно: активного удара. Проверка попадания: Область удара: или физический запрос. Данные противника: Получить урон: один раз за этот удар. Обратная связь: Анимация, звук,: вспышка и отдача. Восстановление: Закончить атаку,: разрешить следующую. Окно попадания и видимая анимация должны быть согласованы.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#aaa"/></marker></defs><rect width="1200" height="520" rx="24" fill="#111"/><text x="50" y="54" fill="#e6e6e6" font-family="Arial,sans-serif" font-size="27">Атака как последовательность состояний</text><path d="M360 160H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 160H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 215V270H205V319" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600" y="258" text-anchor="middle" fill="#bbb" font-family="Arial,sans-serif" font-size="16">если есть цель</text><path d="M360 380H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 380H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Команда игрока</text><text x="70" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Нажатие атаки</text><text x="70" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">при готовом персонаже</text><rect x="445" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Состояние атаки</text><text x="465" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Подготовка и окно</text><text x="465" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">активного удара</text><rect x="840" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Проверка попадания</text><text x="860" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Область удара</text><text x="860" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">или физический запрос</text><rect x="50" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Данные противника</text><text x="70" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Получить урон</text><text x="70" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">один раз за этот удар</text><rect x="445" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Обратная связь</text><text x="465" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Анимация, звук,</text><text x="465" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">вспышка и отдача</text><rect x="840" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Восстановление</text><text x="860" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Закончить атаку,</text><text x="860" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">разрешить следующую</text><text x="50" y="483" fill="#aaa" font-family="Arial,sans-serif" font-size="18">Окно попадания и видимая анимация должны быть согласованы.</text></svg>