<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Время мира и накопление знаний</title><desc id="desc">Часы симуляции: Время внутри цикла: и события по расписанию. Обновление мира: Положение объектов,: состояние окружения. Перезапуск цикла: Восстановить заданное: исходное состояние. Исследование: Управление персонажем: и инструментами. Обнаружение сведений: Взаимодействие: с нужным объектом. Журнал: Сохранить найденные: сведения отдельно. Состояние мира и сведения, сохраняемые между попытками, разделены.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#aaa"/></marker></defs><rect width="1200" height="520" rx="24" fill="#111"/><text x="50" y="54" fill="#e6e6e6" font-family="Arial,sans-serif" font-size="27">Время мира и накопление знаний</text><path d="M360 160H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 160H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M360 380H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 380H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Часы симуляции</text><text x="70" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Время внутри цикла</text><text x="70" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">и события по расписанию</text><rect x="445" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Обновление мира</text><text x="465" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Положение объектов,</text><text x="465" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">состояние окружения</text><rect x="840" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Перезапуск цикла</text><text x="860" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Восстановить заданное</text><text x="860" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">исходное состояние</text><rect x="50" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Исследование</text><text x="70" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Управление персонажем</text><text x="70" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">и инструментами</text><rect x="445" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Обнаружение сведений</text><text x="465" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Взаимодействие</text><text x="465" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">с нужным объектом</text><rect x="840" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Журнал</text><text x="860" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Сохранить найденные</text><text x="860" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">сведения отдельно</text><text x="50" y="483" fill="#aaa" font-family="Arial,sans-serif" font-size="18">Состояние мира и сведения, сохраняемые между попытками, разделены.</text></svg>