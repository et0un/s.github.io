<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Кооперативное условие для двух игроков</title><desc id="desc">Действие игрока A: Удерживает механизм: или активирует объект. Состояние A: Флаг a_active: включён / выключен. Проверка условия: Оба действия активны?: a_active &amp;&amp; b_active. Действие игрока B: Удерживает другой: механизм. Состояние B: Флаг b_active: включён / выключен. Изменение мира: Открыть проход: или запустить событие. Для двух людей на одном устройстве сеть может вообще не понадобиться.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#aaa"/></marker></defs><rect width="1200" height="520" rx="24" fill="#111"/><text x="50" y="54" fill="#e6e6e6" font-family="Arial,sans-serif" font-size="27">Кооперативное условие для двух игроков</text><path d="M360 160H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 160H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M360 380H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 380H800V160H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="780" y="280" text-anchor="middle" fill="#bbb" font-family="Arial,sans-serif" font-size="16">B</text><path d="M995 215V319" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="995" y="261" text-anchor="middle" fill="#bbb" font-family="Arial,sans-serif" font-size="16">да</text><rect x="50" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Действие игрока A</text><text x="70" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Удерживает механизм</text><text x="70" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">или активирует объект</text><rect x="445" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Состояние A</text><text x="465" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Флаг a_active</text><text x="465" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">включён / выключен</text><rect x="840" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Проверка условия</text><text x="860" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Оба действия активны?</text><text x="860" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">a_active &amp;&amp; b_active</text><rect x="50" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Действие игрока B</text><text x="70" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Удерживает другой</text><text x="70" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">механизм</text><rect x="445" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Состояние B</text><text x="465" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Флаг b_active</text><text x="465" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">включён / выключен</text><rect x="840" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Изменение мира</text><text x="860" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Открыть проход</text><text x="860" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">или запустить событие</text><text x="50" y="483" fill="#aaa" font-family="Arial,sans-serif" font-size="18">Для двух людей на одном устройстве сеть может вообще не понадобиться.</text></svg>