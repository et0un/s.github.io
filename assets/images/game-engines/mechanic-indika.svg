<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Один сюжет и смена игровых режимов</title><desc id="desc">Эпизод 3D: Исследование: и пространственная задача. Условие перехода: Достигнута точка: или завершено действие. Режим 2D: Своя камера, управление: и локальные правила. Результат мини-игры: Зафиксировать: условие завершения. Следующий эпизод 3D: Вернуть камеру: и нужное управление. Общий прогресс: Номер главы, события,: контрольная точка. Переключение режима не требует создания другой игры или другого движка.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#aaa"/></marker></defs><rect width="1200" height="520" rx="24" fill="#111"/><text x="50" y="54" fill="#e6e6e6" font-family="Arial,sans-serif" font-size="27">Один сюжет и смена игровых режимов</text><path d="M360 160H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 160H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 215V270H205V319" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600" y="258" text-anchor="middle" fill="#bbb" font-family="Arial,sans-serif" font-size="16">после завершения</text><path d="M360 380H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 380H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Эпизод 3D</text><text x="70" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Исследование</text><text x="70" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">и пространственная задача</text><rect x="445" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Условие перехода</text><text x="465" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Достигнута точка</text><text x="465" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">или завершено действие</text><rect x="840" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Режим 2D</text><text x="860" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Своя камера, управление</text><text x="860" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">и локальные правила</text><rect x="50" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Результат мини-игры</text><text x="70" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Зафиксировать</text><text x="70" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">условие завершения</text><rect x="445" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Следующий эпизод 3D</text><text x="465" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Вернуть камеру</text><text x="465" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">и нужное управление</text><rect x="840" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Общий прогресс</text><text x="860" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Номер главы, события,</text><text x="860" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">контрольная точка</text><text x="50" y="483" fill="#aaa" font-family="Arial,sans-serif" font-size="18">Переключение режима не требует создания другой игры или другого движка.</text></svg>