<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Улики, словарь и проверка гипотезы</title><desc id="desc">Активная область: Идентификатор объекта: и описание улики. Действие игрока: Осмотреть объект: и получить сведения. Набор известных слов: Хранить найденные: идентификаторы. Поля ответа: Подставить слова: в формулировку. Проверка: Сопоставить ответ: с условиями эпизода. Состояние эпизода: Зафиксировать решение: и открыть продолжение. Неверный ответ оставляет возможность изменить гипотезу и проверить её снова.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#aaa"/></marker></defs><rect width="1200" height="520" rx="24" fill="#111"/><text x="50" y="54" fill="#e6e6e6" font-family="Arial,sans-serif" font-size="27">Улики, словарь и проверка гипотезы</text><path d="M360 160H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 160H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 215V270H205V319" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600" y="258" text-anchor="middle" fill="#bbb" font-family="Arial,sans-serif" font-size="16">выбор из словаря</text><path d="M360 380H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 380H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Активная область</text><text x="70" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Идентификатор объекта</text><text x="70" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">и описание улики</text><rect x="445" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Действие игрока</text><text x="465" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Осмотреть объект</text><text x="465" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">и получить сведения</text><rect x="840" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Набор известных слов</text><text x="860" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Хранить найденные</text><text x="860" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">идентификаторы</text><rect x="50" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Поля ответа</text><text x="70" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Подставить слова</text><text x="70" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">в формулировку</text><rect x="445" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Проверка</text><text x="465" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Сопоставить ответ</text><text x="465" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">с условиями эпизода</text><rect x="840" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Состояние эпизода</text><text x="860" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Зафиксировать решение</text><text x="860" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">и открыть продолжение</text><text x="50" y="483" fill="#aaa" font-family="Arial,sans-serif" font-size="18">Неверный ответ оставляет возможность изменить гипотезу и проверить её снова.</text></svg>