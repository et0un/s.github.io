<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Оружие как данные и повторяемое поведение</title><desc id="desc">Описание оружия: Урон, дальность,: скорость и тип атаки. Условие выстрела: Прошло время ожидания,: цель доступна. Атака: Создать снаряд: или проверить область. Противник: Здоровье, движение,: получение урона. Награда: Ресурсы и опыт: после уничтожения. Магазин и сборка: Изменить параметры: следующей волны. Модификаторы сборки изменяют исходные данные оружия и персонажа.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#aaa"/></marker></defs><rect width="1200" height="520" rx="24" fill="#111"/><text x="50" y="54" fill="#e6e6e6" font-family="Arial,sans-serif" font-size="27">Оружие как данные и повторяемое поведение</text><path d="M360 160H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 160H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 215V270H205V319" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600" y="258" text-anchor="middle" fill="#bbb" font-family="Arial,sans-serif" font-size="16">попадание</text><path d="M360 380H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 380H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Описание оружия</text><text x="70" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Урон, дальность,</text><text x="70" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">скорость и тип атаки</text><rect x="445" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Условие выстрела</text><text x="465" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Прошло время ожидания,</text><text x="465" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">цель доступна</text><rect x="840" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Атака</text><text x="860" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Создать снаряд</text><text x="860" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">или проверить область</text><rect x="50" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Противник</text><text x="70" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Здоровье, движение,</text><text x="70" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">получение урона</text><rect x="445" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Награда</text><text x="465" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Ресурсы и опыт</text><text x="465" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">после уничтожения</text><rect x="840" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Магазин и сборка</text><text x="860" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Изменить параметры</text><text x="860" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">следующей волны</text><text x="50" y="483" fill="#aaa" font-family="Arial,sans-serif" font-size="18">Модификаторы сборки изменяют исходные данные оружия и персонажа.</text></svg>