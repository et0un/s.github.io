<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Добыча, волны и улучшения</title><desc id="desc">Таймер забега: Текущее время: и номер волны. Спавнер противников: Создать волну: в заданный момент. Купол и защита: Урон, прочность,: параметры оружия. Карта из блоков: Прочность блока,: тип ресурса. Добыча и инвентарь: Разрушить блок,: забрать ресурс. Улучшения: Обменять ресурсы: на новые параметры. Менеджер забега связывает время, опасность и экономику ресурсов.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#aaa"/></marker></defs><rect width="1200" height="520" rx="24" fill="#111"/><text x="50" y="54" fill="#e6e6e6" font-family="Arial,sans-serif" font-size="27">Добыча, волны и улучшения</text><path d="M360 160H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 160H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M360 380H439" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M755 380H834" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M995 325V221" stroke="#aaa" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="995" y="267" text-anchor="middle" fill="#bbb" font-family="Arial,sans-serif" font-size="16">параметры</text><rect x="50" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Таймер забега</text><text x="70" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Текущее время</text><text x="70" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">и номер волны</text><rect x="445" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Спавнер противников</text><text x="465" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Создать волну</text><text x="465" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">в заданный момент</text><rect x="840" y="105" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="139" fill="#eee" font-family="Arial,sans-serif" font-size="21">Купол и защита</text><text x="860" y="172" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Урон, прочность,</text><text x="860" y="197" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">параметры оружия</text><rect x="50" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="70" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Карта из блоков</text><text x="70" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Прочность блока,</text><text x="70" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">тип ресурса</text><rect x="445" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="465" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Добыча и инвентарь</text><text x="465" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Разрушить блок,</text><text x="465" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">забрать ресурс</text><rect x="840" y="325" width="310" height="110" rx="14" fill="#1b1b1b" stroke="#656565"/><text x="860" y="359" fill="#eee" font-family="Arial,sans-serif" font-size="21">Улучшения</text><text x="860" y="392" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">Обменять ресурсы</text><text x="860" y="417" fill="#b9b9b9" font-family="Arial,sans-serif" font-size="18">на новые параметры</text><text x="50" y="483" fill="#aaa" font-family="Arial,sans-serif" font-size="18">Менеджер забега связывает время, опасность и экономику ресурсов.</text></svg>